<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story map</title>
<style>
__CSS__
body { display: grid; grid-template-rows: auto 1fr 96px; height: 100vh; }
main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); min-height: 0; }
#map2d { cursor: crosshair; }
@media (max-width: 760px) {
  body { grid-template-rows: auto auto auto 80px; height: auto; min-height: 100vh; }
  main { grid-template-columns: 1fr; }
  .stage { height: 60vh; }
}
</style>
__HEAD_LIBS__
</head>
<body>
<header>
  <select id="book"></select><select id="emotion"></select><select id="method"></select>
  <button class="toggle" id="dim" aria-pressed="false">3D</button>
</header>
<main>
  <div class="stage"><svg id="map2d" class="scene"></svg><div id="map3d" class="hidden"></div></div>
  <div class="read"><div class="chapter" id="chapter"></div><div class="text" id="text"></div></div>
</main>
<svg id="timeline" class="timeline"></svg>
<script type="module">
__VIEWER_JS__

const DATA = __DATA__;
const NAMES = { kernel: "kernel", bspline: "b-spline", poisson: "poisson" };
const S = { book: Object.keys(DATA.books)[0], emotion: DATA.emotions[0], method: "kernel", three: false, i: 0 };
const book = () => DATA.books[S.book];
const field = () => book().fields[S.method][S.emotion];
const series = () => book().timeline[S.emotion];

for (const [k, b] of Object.entries(DATA.books)) $("book").add(new Option(b.title, k));
if (Object.keys(DATA.books).length < 2) $("book").style.display = "none";
for (const e of DATA.emotions) $("emotion").add(new Option(e, e));
function methods() {
  const sel = $("method"), keep = S.method;
  sel.innerHTML = "";
  for (const k of Object.keys(book().fields)) sel.add(new Option(NAMES[k] || k, k));
  S.method = book().fields[keep] ? keep : "kernel";
  sel.value = S.method;
}
$("book").onchange = (e) => { S.book = e.target.value; S.i = 0; methods(); draw(); };
$("emotion").onchange = (e) => { S.emotion = e.target.value; draw(); };
$("method").onchange = (e) => { S.method = e.target.value; draw(); };
$("dim").onclick = () => {
  S.three = !S.three; $("dim").setAttribute("aria-pressed", S.three);
  $("map2d").classList.toggle("hidden", S.three); $("map3d").classList.toggle("hidden", !S.three);
  draw();
};

// value range of a field inside the paragraphs' footprint
const range = (f) => {
  const s = book().support, v = f.filter((x, k) => x !== null && s[k] >= 1);
  return [d3.min(v), d3.max(v)];
};

// ---- 2-D ----------------------------------------------------------------------
let sx, sy;
function draw2d() {
  const svg = d3.select("#map2d"), el = $("map2d"), b = book(), f = field();
  const W = el.clientWidth, H = el.clientHeight, m = 24, [x0, x1, y0, y1] = b.extent, n = b.n;
  const k = Math.min((W - 2 * m) / (x1 - x0), (H - 2 * m) / (y1 - y0));
  const ox = (W - k * (x1 - x0)) / 2, oy = (H - k * (y1 - y0)) / 2;
  sx = (x) => ox + (x - x0) * k; sy = (y) => H - oy - (y - y0) * k;
  svg.selectAll("*").remove();
  const toX = (u) => x0 + (u - 0.5) / (n - 1) * (x1 - x0), toY = (v) => y0 + (v - 0.5) / (n - 1) * (y1 - y0);
  const proj = d3.geoTransform({ point(u, v) { this.stream.point(sx(toX(u)), sy(toY(v))); } });
  svg.append("clipPath").attr("id", "fp").append("path")
    .attr("d", d3.geoPath(proj)(d3.contours().size([n, n]).thresholds([1])(b.support)[0]));
  const [lo, hi] = range(f), R = ramp();
  const grid = f.map((v) => (v === null ? lo - 1 : v));
  svg.append("g").attr("clip-path", "url(#fp)").selectAll("path")
    .data(d3.contours().size([n, n]).thresholds(d3.range(R.length).map((j) => lo + (hi - lo) * j / R.length))(grid))
    .join("path").attr("d", d3.geoPath(proj)).attr("fill", (d, j) => R[j]);
  svg.append("g").attr("fill", css("--dot")).attr("fill-opacity", 0.28).selectAll("circle")
    .data(b.x).join("circle").attr("cx", (x) => sx(x)).attr("cy", (x, j) => sy(b.y[j])).attr("r", 1.6);
  // the arc, coloured by reading order: faint ahead of the reader, solid behind
  const dense = denseArc(b.arc), N = b.text.length - 1;
  svg.append("g").attr("fill", "none").attr("stroke-linecap", "round").selectAll("line")
    .data(dense.slice(1).map((p, k) => [dense[k], p])).join("line").attr("class", "seg")
    .attr("x1", (s) => sx(s[0][0])).attr("y1", (s) => sy(s[0][1]))
    .attr("x2", (s) => sx(s[1][0])).attr("y2", (s) => sy(s[1][1]))
    .attr("stroke", (s) => orderAt(s[0][2] / N));
  // what the map means: PC1 / PC2 of the paragraph embeddings, and the colour key
  const muted = css("--ink-3"), fmt = d3.format(".2f");
  svg.append("text").attr("x", (sx(x0) + sx(x1)) / 2).attr("y", Math.min(H - 6, sy(y0) + 16)).attr("text-anchor", "middle")
    .attr("fill", muted).attr("font-size", 12).text("PC1");
  svg.append("text").attr("transform", `translate(${Math.max(12, sx(x0) - 8)},${(sy(y0) + sy(y1)) / 2}) rotate(-90)`)
    .attr("text-anchor", "middle").attr("fill", muted).attr("font-size", 12).text("PC2");
  const key = svg.append("g").attr("transform", `translate(${W - m - R.length * 14 - 4},${H - 30})`);
  key.selectAll("rect").data(R).join("rect").attr("x", (c, j) => j * 14).attr("width", 14).attr("height", 8).attr("fill", (c) => c);
  key.append("text").attr("x", -6).attr("y", 8).attr("text-anchor", "end").attr("fill", muted).attr("font-size", 11).text(fmt(lo));
  key.append("text").attr("x", R.length * 14 + 6).attr("y", 8).attr("fill", muted).attr("font-size", 11).text(fmt(hi));
  key.append("text").attr("x", R.length * 7).attr("y", -5).attr("text-anchor", "middle").attr("fill", muted).attr("font-size", 11).text(S.emotion);
  svg.append("circle").attr("id", "mark").attr("r", 6).attr("fill", css("--ink"))
    .attr("stroke", css("--surface")).attr("stroke-width", 2);
}
$("map2d").addEventListener("click", (ev) => {
  const [mx, my] = d3.pointer(ev), b = book();
  go(d3.minIndex(b.x, (x, j) => (sx(x) - mx) ** 2 + (sy(b.y[j]) - my) ** 2));
});

// ---- 3-D ----------------------------------------------------------------------
let scene3 = null, arc3 = [], ground = null, marker3 = null, trav3 = null;
function draw3d() {
  if (!scene3) {
    scene3 = Scene($("map3d"));
    scene3.renderer.domElement.addEventListener("dblclick", pick3d);
  }
  scene3.clear(); trav3 = null;
  const b = book(), f = field(), F = Frame(b.extent), [lo, hi] = range(f);
  const h = (v) => lift(v, lo, hi);
  ground = terrain(f, b.n, b.extent, { height: h, lo, hi, keep: (k) => b.support[k] >= 1 });
  scene3.group.add(ground);
  const fmt = d3.format(".2f");
  scene3.group.add(axes3d(scene3, b.extent, {
    height: RELIEF, title: S.emotion,
    ticks: [lo, (lo + hi) / 2, hi].map((v) => [h(v), fmt(v)]) }));
  arc3 = denseArc(b.arc).map(([x, y, c]) => {
    const v = sample(f, b.n, b.extent, x, y);
    return [F.X(x), h(Number.isFinite(v) ? v : lo) + 0.006, F.Z(y), c];
  });
  const N = b.text.length - 1;
  const orderOf = (pts) => (t) => orderAt(pts[Math.round(t * (pts.length - 1))][3] / N);
  scene3.group.add(curve(arc3.map((p) => p.slice(0, 3)), 0.0016, null, { colorAt: orderOf(arc3), opacity: 0.35 }));
  marker3 = ball([0, 0, 0], 0.014, css("--ink"));
  scene3.group.add(marker3);
}
// double-click the terrain: jump to the nearest paragraph
function pick3d(ev) {
  const r = scene3.renderer.domElement.getBoundingClientRect();
  const ray = new scene3.THREE.Raycaster();
  ray.setFromCamera({ x: (ev.clientX - r.left) / r.width * 2 - 1, y: -(ev.clientY - r.top) / r.height * 2 + 1 }, scene3.camera);
  const hit = ray.intersectObject(ground)[0];
  if (!hit) return;
  const b = book(), F = Frame(b.extent);
  go(d3.minIndex(b.x, (x, j) => (F.X(x) - hit.point.x) ** 2 + (F.Z(b.y[j]) - hit.point.z) ** 2));
}

// ---- reading --------------------------------------------------------------------
const tl = Timeline($("timeline"), (i) => go(i));
function go(i) {
  const b = book();
  S.i = Math.max(0, Math.min(b.text.length - 1, i));
  if (S.three) {
    const j = Math.max(0, d3.bisector((p) => p[3]).left(arc3, S.i) - 1);
    if (trav3) { scene3.group.remove(trav3); trav3.geometry.dispose(); trav3 = null; }
    if (j > 0) {
      const done = arc3.slice(0, j + 1), N = b.text.length - 1;
      trav3 = curve(done.map((p) => p.slice(0, 3)), 0.0028, null,
                    { colorAt: (t) => orderAt(done[Math.round(t * (done.length - 1))][3] / N) });
      scene3.group.add(trav3);
    }
    marker3.position.set(...arc3[j].slice(0, 3));
    scene3.request();
  } else {
    const { k, t } = pathAt(b.arc, S.i), P = b.arc;
    const p = [P[k][0] + t * (P[k + 1][0] - P[k][0]), P[k][1] + t * (P[k + 1][1] - P[k][1])];
    d3.selectAll("#map2d .seg").attr("stroke-opacity", (s) => (s[0][2] <= S.i ? 1 : 0.28))
      .attr("stroke-width", (s) => (s[0][2] <= S.i ? 2.6 : 1.6));
    d3.select("#mark").attr("cx", sx(p[0])).attr("cy", sy(p[1]));
  }
  tl.set(S.i);
  setText(b, S.i, $("chapter"), $("text"));
  publish(`${S.book}/${S.emotion}/${S.i}${S.three ? "/3d" : ""}`);
}
function draw() {
  S.three ? draw3d() : draw2d();
  tl.draw(series(), book().chapter, null, { order: true });
  go(S.i);
}
readingKeys(() => S.i, () => book().text.length, go);

// open at #book/emotion/paragraph[/3d] -- on load, and whenever the hash is set
function fromHash(state) {
  const [bk, em, i, d] = state.split("/");
  if (DATA.books[bk]) S.book = bk;
  $("book").value = S.book; methods();
  if (DATA.emotions.includes(em)) { S.emotion = em; $("emotion").value = em; }
  if (i && !isNaN(+i)) S.i = +i;
  S.three = d === "3d"; $("dim").setAttribute("aria-pressed", S.three);
  $("map2d").classList.toggle("hidden", S.three); $("map3d").classList.toggle("hidden", !S.three);
  draw();
}
follow(fromHash);
window.addEventListener("resize", () => { if (!S.three) draw(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
</script>
</body>
</html>
