<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surface lab</title>
<style>
__CSS__
body { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
.lab { position: relative; min-height: 0; }
#canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(4, 1fr);
        grid-auto-rows: 1fr; pointer-events: none; }
.cell { position: relative; }
.cell span { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center;
             color: var(--ink-3); font-size: 12px; }
@media (max-width: 760px) { .grid { grid-template-columns: repeat(2, 1fr); } }
</style>
__HEAD_LIBS__
</head>
<body>
<header><select id="book"></select><select id="emotion"></select></header>
<div class="lab"><canvas id="canvas"></canvas><div class="grid" id="grid"></div></div>
<script type="module">
__VIEWER_JS__

const DATA = __DATA__;
const S = { book: Object.keys(DATA.books)[0], emotion: DATA.emotions[0] };
const book = () => DATA.books[S.book];
for (const [k, b] of Object.entries(DATA.books)) $("book").add(new Option(b.title, k));
for (const e of DATA.emotions) $("emotion").add(new Option(e, e));
$("book").onchange = (e) => { S.book = e.target.value; build(); };
$("emotion").onchange = (e) => { S.emotion = e.target.value; build(); };

// one renderer, one camera, one scene per panel drawn into its own viewport
const canvas = $("canvas");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setScissorTest(true);
const camera = new THREE.PerspectiveCamera(32, 1, 0.01, 100);
camera.position.set(2.0, 2.3, 2.6);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0.35, 0);
controls.enableDamping = true;
let panels = [];

function lights(scene) {
  scene.add(new THREE.HemisphereLight(0xffffff, 0x777777, 2.2));
  const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(1, 3, 2); scene.add(sun);
}

function build() {
  const b = book(), e = S.emotion, grid = $("grid");
  panels.forEach((p) => p.scene.traverse((o) => o.geometry?.dispose()));
  panels = []; grid.innerHTML = "";
  // one shared scale: the Gaussian surface's range inside the paragraphs' footprint
  const ref = (b.panels.gaussian || Object.values(b.panels)[0])[e];
  const inside = ref.filter((v, k) => v !== null && b.support[k] >= 1);
  const lo = d3.min(inside), hi = d3.max(inside), pad = 0.5 * (hi - lo);
  const h = (v) => lift(Math.max(lo - pad, Math.min(hi + pad, v)), lo, hi);
  const add = (name, obj) => {
    const scene = new THREE.Scene(); lights(scene); scene.add(obj);
    const cell = document.createElement("div"); cell.className = "cell";
    cell.innerHTML = `<span>${name}</span>`; grid.appendChild(cell);
    panels.push({ scene, cell });
  };
  // the raw cloud: each paragraph at its own score
  const F = Frame(b.extent), sc = b.scores[e];
  const pos = new Float32Array(b.x.length * 3), col = new Float32Array(b.x.length * 3);
  b.x.forEach((x, j) => {
    pos.set([F.X(x), h(sc[j]), F.Z(b.y[j])], 3 * j);
    const c = new THREE.Color(rampAt((sc[j] - lo) / (hi - lo))); col.set([c.r, c.g, c.b], 3 * j);
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  g.setAttribute("color", new THREE.BufferAttribute(col, 3));
  add("points", new THREE.Points(g, new THREE.PointsMaterial({ size: 3, sizeAttenuation: false, vertexColors: true })));
  for (const [name, per] of Object.entries(b.panels)) {
    add(name, terrain(per[e], b.n, b.extent, { height: h, lo, hi, keep: (k) => b.support[k] >= 1 }));
  }
  request();
}

let raf = null;
const request = () => { if (!raf) raf = requestAnimationFrame(render); };
function render() {
  raf = null;
  if (controls.update()) request();
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (canvas.width !== Math.round(W * devicePixelRatio)) renderer.setSize(W, H, false);
  renderer.setClearColor(0x000000, 0); renderer.clear();
  const top = canvas.getBoundingClientRect();
  for (const { scene, cell } of panels) {
    const r = cell.getBoundingClientRect();
    const x = r.left - top.left, y = H - (r.bottom - top.top);
    renderer.setViewport(x, y, r.width, r.height); renderer.setScissor(x, y, r.width, r.height);
    camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
    renderer.render(scene, camera);
  }
}
controls.addEventListener("change", request);
new ResizeObserver(request).observe(canvas);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", build);

// open at #book/emotion
{
  const [bk, em] = decodeURIComponent(location.hash.slice(1)).split("/");
  if (DATA.books[bk]) S.book = bk;
  if (DATA.emotions.includes(em)) S.emotion = em;
  $("book").value = S.book; $("emotion").value = S.emotion;
  build();
}
</script>
</body>
</html>
