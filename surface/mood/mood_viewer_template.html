<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mood surface</title>
<style>
__CSS__
body { display: grid; grid-template-rows: auto 1fr 96px; height: 100vh; }
.read .mood { color: var(--ink-2); font-size: 13px; margin: -6px 0 12px; }
.read .mood i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); min-height: 0; }
@media (max-width: 760px) {
  body { grid-template-rows: auto auto auto 80px; height: auto; min-height: 100vh; }
  main { grid-template-columns: 1fr; }
  .stage { height: 60vh; }
}
</style>
__HEAD_LIBS__
</head>
<body>
<header><select id="book"></select><button class="toggle" id="axes" aria-pressed="true">axes</button><button class="toggle" id="ride" aria-pressed="false">ride</button></header>
<main>
  <div class="stage" id="stage"></div>
  <div class="read"><div class="chapter" id="chapter"></div><div class="mood" id="mood"></div><div class="text" id="text"></div></div>
</main>
<svg id="timeline" class="timeline"></svg>
<script type="module">
__VIEWER_JS__

const DATA = __DATA__;
const H = 0.8;   // world height of mood = 1 (humor); mood = 0 is sadness
const S = { book: Object.keys(DATA.books)[0], i: 0, axes: true };
const book = () => DATA.books[S.book];
// the colour of a mood value: the emotions' colours at their spectrum positions, blended
const moodColor = () => d3.scaleLinear(book().positions, book().colors).interpolate(d3.interpolateLab).clamp(true);
for (const [k, b] of Object.entries(DATA.books)) $("book").add(new Option(b.title, k));
if (Object.keys(DATA.books).length < 2) $("book").style.display = "none";
$("book").onchange = (e) => { S.book = e.target.value; S.i = 0; draw(); };
$("axes").onclick = () => {
  S.axes = !S.axes; $("axes").setAttribute("aria-pressed", S.axes);
  showAxes(scene.group, S.axes && !rider.riding); scene.request();
};

const scene = Scene($("stage")), rider = Rider(scene);
let rideTrack = null;
$("ride").onclick = () => {
  rider.riding ? rider.off() : rider.on();
  $("ride").setAttribute("aria-pressed", rider.riding);
  showAxes(scene.group, S.axes && !rider.riding);    // no axes floating in the ride view
  go(S.pos ?? S.i);
};
scene.controls.target.set(0, 0.3, 0);
scene.renderer.domElement.addEventListener("dblclick", pick);
let arc = [], ground = null, marker = null, trav = null;

function draw() {
  const b = book(), F = Frame(b.extent), f = b.field;
  scene.clear(); trav = null; S.drawn = null;
  ground = terrain(f, b.n, b.extent, { height: (v) => v * H, color: moodColor(),
                                       keep: (k) => b.support[k] >= 1 });
  scene.group.add(ground);
  scene.group.add(axes3d(scene, b.extent));   // PC1 / PC2 on the floor
  // the emotion axis, standing just left of the terrain as the starting camera sees
  // it: the spectrum, sadness at the bottom
  const corner = axisFoot(scene), emotionAxis = new THREE.Group();
  emotionAxis.userData.axes = true;
  scene.group.add(emotionAxis);
  emotionAxis.add(curve([[corner[0], 0, corner[2]], [corner[0], H, corner[2]]], 0.0025, css("--arc")));
  b.order.forEach((name, j) => {
    const y = b.positions[j] * H;
    emotionAxis.add(label(name, [corner[0], y, corner[2]], { dot: b.colors[j] }));
  });
  showAxes(scene.group, S.axes && !rider.riding);
  // the arc on the surface
  arc = b.route.map(([x, y, c]) => {
    const v = sample(f, b.n, b.extent, x, y);
    return [F.X(x), (Number.isFinite(v) ? v : 0) * H + 0.006, F.Z(y), c];
  });
  scene.group.add(curve(arc.map((p) => p.slice(0, 3)), 0.0016, css("--ink-3")));
  rideTrack = track(arc);
  marker = ball([0, 0, 0], 0.016, css("--ink"));
  scene.group.add(marker);
  tl.draw(b.timeline, b.chapter, b.positions.map((p, j) => [p, b.colors[j]]));
  go(S.i);
}

// double-click the surface: jump to the nearest paragraph's place on the arc
function pick(ev) {
  const r = scene.renderer.domElement.getBoundingClientRect();
  const ray = new THREE.Raycaster();
  ray.setFromCamera({ x: (ev.clientX - r.left) / r.width * 2 - 1, y: -(ev.clientY - r.top) / r.height * 2 + 1 }, scene.camera);
  const hit = ray.intersectObject(ground)[0];
  if (!hit) return;
  const j = d3.minIndex(arc, (p) => (p[0] - hit.point.x) ** 2 + (p[2] - hit.point.z) ** 2);
  go(Math.round(arc[j][3]));
}

const tl = Timeline($("timeline"), (i) => go(i));
function go(i) {
  const b = book(), N = b.text.length - 1;
  S.pos = Math.max(0, Math.min(N, i)); S.i = Math.round(S.pos);
  const { j, p, u } = onArc(arc, S.pos), key = `${j}/${rider.riding}`;
  if (key !== S.drawn) {            // the passed part: ink, or reading-order colours when riding
    if (trav) { scene.group.remove(trav); trav.geometry.dispose(); }
    trav = passed(arc, j, arc[j].slice(0, 3), N, 0.0026, rider.riding ? null : css("--ink"));
    if (trav) scene.group.add(trav);
    S.drawn = key;
  }
  marker.position.set(...p);
  marker.visible = !rider.riding;
  rider.at(rideTrack, u);
  scene.request();
  tl.set(S.pos);
  setText(b, S.i, $("chapter"), $("text"));
  const e = d3.minIndex(b.positions, (q) => Math.abs(q - b.mood[S.i]));
  $("mood").innerHTML = `<i style="background:${b.colors[e]}"></i>${b.order[e]}`;
  publish(`${S.book}/${S.i}`);
}
Transport(document.querySelector("header"), { getPos: () => S.pos ?? S.i, getN: () => book().text.length,
  getChapter: () => book().chapter, go });

// open at #book/paragraph -- on load, and whenever the hash is set
function fromHash(state) {
  const [bk, i] = state.split("/");
  if (DATA.books[bk]) S.book = bk;
  $("book").value = S.book;
  if (i && !isNaN(+i)) S.i = +i;
  draw();
}
follow(fromHash);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
</script>
</body>
</html>
