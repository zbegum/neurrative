<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mood surface</title>
<style>
__CSS__
body { display: grid; grid-template-rows: auto 1fr 96px; height: 100vh; }
main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); min-height: 0; }
@media (max-width: 760px) {
  body { grid-template-rows: auto auto auto 80px; height: auto; min-height: 100vh; }
  main { grid-template-columns: 1fr; }
  .stage { height: 60vh; }
}
</style>
__HEAD_LIBS__
</head>
<body>
<header><select id="book"></select></header>
<main>
  <div class="stage" id="stage"></div>
  <div class="read"><div class="chapter" id="chapter"></div><div class="text" id="text"></div></div>
</main>
<svg id="timeline" class="timeline"></svg>
<script type="module">
__VIEWER_JS__

const DATA = __DATA__;
const H = 0.8;   // world height of mood = 1 (humor); mood = 0 is sadness
const S = { book: Object.keys(DATA.books)[0], i: 0 };
const book = () => DATA.books[S.book];
for (const [k, b] of Object.entries(DATA.books)) $("book").add(new Option(b.title, k));
$("book").onchange = (e) => { S.book = e.target.value; S.i = 0; draw(); };

const scene = Scene($("stage"));
scene.controls.target.set(0, 0.3, 0);
scene.renderer.domElement.addEventListener("dblclick", pick);
let arc = [], ground = null, marker = null, trav = null;

function draw() {
  const b = book(), F = Frame(b.extent), f = b.field;
  scene.clear(); trav = null;
  const inside = f.filter((v, k) => v !== null && b.support[k] >= 1);
  ground = terrain(f, b.n, b.extent, { height: (v) => v * H, lo: d3.min(inside), hi: d3.max(inside),
                                       keep: (k) => b.support[k] >= 1 });
  scene.group.add(ground);
  // the emotion axis, standing just left of the terrain as the starting camera sees
  // it: the spectrum, sadness at the bottom
  const cam = scene.camera.position, r = Math.hypot(cam.x, cam.z);
  const corner = [-1.05 * cam.z / r, 0, 1.05 * cam.x / r];
  scene.group.add(curve([[corner[0], 0, corner[2]], [corner[0], H, corner[2]]], 0.0025, css("--arc")));
  b.order.forEach((name, j) => {
    const y = b.positions[j] * H;
    scene.group.add(label(name, [corner[0], y, corner[2]]));
  });
  // the arc on the surface
  arc = denseArc(b.arc).map(([x, y, c]) => {
    const v = sample(f, b.n, b.extent, x, y);
    return [F.X(x), (Number.isFinite(v) ? v : 0) * H + 0.006, F.Z(y), c];
  });
  scene.group.add(curve(arc.map((p) => p.slice(0, 3)), 0.0016, css("--arc")));
  marker = ball([0, 0, 0], 0.015, css("--marker"));
  scene.group.add(marker);
  tl.draw(b.timeline, b.chapter);
  go(S.i);
}

// double-click the surface: jump to the nearest paragraph's place on the arc
function pick(ev) {
  const r = scene.renderer.domElement.getBoundingClientRect();
  const ray = new THREE.Raycaster();
  ray.setFromCamera({ x: (ev.clientX - r.left) / r.width * 2 - 1, y: -(ev.clientY - r.top) / r.height * 2 + 1 }, scene.camera);
  const hit = ray.intersectObject(ground)[0];
  if (!hit) return;
  const j = d3.minIndex(arc, (p) => (p[0] - hit.point.x) ** 2 + (p[2] - hit.point.z) ** 2);
  go(Math.round(arc[j][3]));
}

const tl = Timeline($("timeline"), (i) => go(i));
function go(i) {
  const b = book();
  S.i = Math.max(0, Math.min(b.text.length - 1, i));
  const j = Math.max(0, d3.bisector((p) => p[3]).left(arc, S.i) - 1);
  if (trav) { scene.group.remove(trav); trav.geometry.dispose(); trav = null; }
  if (j > 0) { trav = curve(arc.slice(0, j + 1).map((p) => p.slice(0, 3)), 0.0026, css("--ink")); scene.group.add(trav); }
  marker.position.set(...arc[j].slice(0, 3));
  scene.request();
  tl.set(S.i);
  setText(b, S.i, $("chapter"), $("text"));
  history.replaceState(null, "", `#${S.book}/${S.i}`);
}
readingKeys(() => S.i, () => book().text.length, go);

// open at #book/paragraph
{
  const [bk, i] = decodeURIComponent(location.hash.slice(1)).split("/");
  if (DATA.books[bk]) S.book = bk;
  $("book").value = S.book;
  if (i && !isNaN(+i)) S.i = +i;
  draw();
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
</script>
</body>
</html>
