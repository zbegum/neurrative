<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arc 3-D</title>
<style>
__CSS__
body { display: grid; grid-template-rows: auto 1fr 96px; height: 100vh; }
main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); min-height: 0; }
@media (max-width: 760px) {
  body { grid-template-rows: auto auto auto 80px; height: auto; min-height: 100vh; }
  main { grid-template-columns: 1fr; }
  .stage { height: 60vh; }
}
</style>
__HEAD_LIBS__
</head>
<body>
<header>
  <select id="book"></select><select id="proj"></select><select id="emotion"></select>
  <button class="toggle" id="tube" aria-pressed="false">tube</button>
</header>
<main>
  <div class="stage" id="stage"></div>
  <div class="read"><div class="chapter" id="chapter"></div><div class="text" id="text"></div></div>
</main>
<svg id="timeline" class="timeline"></svg>
<script type="module">
__VIEWER_JS__

const DATA = __DATA__;
const PNAME = { pca: "PCA", umap: "UMAP", tsne: "t-SNE" };
const S = { book: Object.keys(DATA.books)[0], proj: "pca", emotion: DATA.emotions[0], tube: false, i: 0 };
const book = () => DATA.books[S.book];

for (const [k, b] of Object.entries(DATA.books)) $("book").add(new Option(b.title, k));
for (const e of DATA.emotions) $("emotion").add(new Option(e, e));
function controlsFor() {
  const b = book(), sel = $("proj");
  sel.innerHTML = "";
  for (const p of Object.keys(b.proj)) sel.add(new Option(PNAME[p] || p, p));
  if (!b.proj[S.proj]) S.proj = Object.keys(b.proj)[0];
  sel.value = S.proj;
  $("emotion").style.display = b.timeline ? "" : "none";
  const canTube = !!b.tube && S.proj === "pca";
  $("tube").style.display = canTube ? "" : "none";
  if (!canTube) { S.tube = false; $("tube").setAttribute("aria-pressed", false); }
}
$("book").onchange = (e) => { S.book = e.target.value; S.i = 0; controlsFor(); draw(); };
$("proj").onchange = (e) => { S.proj = e.target.value; controlsFor(); draw(); };
$("emotion").onchange = (e) => { S.emotion = e.target.value; draw(); };
$("tube").onclick = () => { S.tube = !S.tube; $("tube").setAttribute("aria-pressed", S.tube); draw(); };

const scene = Scene($("stage"));
scene.controls.target.set(0, 0, 0);
scene.camera.position.set(1.9, 1.3, 2.4);
let W3 = [], trav = null, marker = null;

// fit the windows into a unit box around the origin (component 3 is up)
function placer(windows) {
  const c = [0, 1, 2].map((d) => d3.mean(windows, (w) => w[d]));
  const s = d3.max(windows, (w) => Math.max(...[0, 1, 2].map((d) => Math.abs(w[d] - c[d])))) || 1;
  return (p) => [(p[0] - c[0]) / s, (p[2] - c[2]) / s, -(p[1] - c[1]) / s];
}

function draw() {
  const b = book(), P = b.proj[S.proj], place = placer(P.windows);
  scene.clear(); trav = null;
  // the fitted B-spline; with the tube on, the tube (around its own fit) takes its place
  if (!(S.tube && b.tube)) scene.group.add(curve(P.curve.map(place), 0.006, css("--arc")));
  W3 = P.windows.map((w, k) => [...place(w), b.centers[k]]);
  if (S.tube && b.tube) {
    const T = b.tube, v = T.vertices, pos = new Float32Array(v.length), col = new Float32Array(v.length);
    const base = new THREE.Color(css("--arc")), hi = new THREE.Color(css("--line"));
    const j = T.labels.indexOf(S.emotion), K = T.labels.length, nr = (v.length / 3 - 2) / K;
    for (let q = 0; q < v.length / 3; q++) {
      pos.set(place([v[3 * q], v[3 * q + 1], v[3 * q + 2]]), 3 * q);
      const onRidge = q < nr * K && q % K === j;
      const c = onRidge ? hi : base; col.set([c.r, c.g, c.b], 3 * q);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    g.setAttribute("color", new THREE.BufferAttribute(col, 3));
    g.setIndex(T.faces); g.computeVertexNormals();
    scene.group.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({
      vertexColors: true, transparent: true, opacity: 0.55, side: THREE.DoubleSide, roughness: 0.8 })));
  }
  marker = ball([0, 0, 0], 0.03, css("--marker"));
  scene.group.add(marker);
  if (b.timeline) tl.draw(b.timeline[S.emotion], b.chapter);
  else tl.draw(b.chapter.map(() => 0), b.chapter);
  go(S.i);
}

const tl = Timeline($("timeline"), (i) => go(i));
function go(i) {
  const b = book();
  S.i = Math.max(0, Math.min(b.text.length - 1, i));
  const { k, t } = pathAt(W3, S.i);
  const p = [0, 1, 2].map((d) => W3[k][d] + t * (W3[k + 1][d] - W3[k][d]));
  if (trav) { scene.group.remove(trav); trav.geometry.dispose(); trav = null; }
  const pts = W3.slice(0, k + 1).map((w) => w.slice(0, 3)).concat([p]);
  if (pts.length > 1) { trav = curve(pts, 0.004, css("--ink")); scene.group.add(trav); }
  marker.position.set(...p);
  scene.request();
  tl.set(S.i);
  setText(b, S.i, $("chapter"), $("text"));
  publish(`${S.book}/${S.proj}/${S.emotion}/${S.i}${S.tube ? "/tube" : ""}`);
}
readingKeys(() => S.i, () => book().text.length, go);

// open at #book/projection/emotion/paragraph[/tube] -- on load, and whenever the hash is set
function fromHash(state) {
  const [bk, pr, em, i, tb] = state.split("/");
  if (DATA.books[bk]) S.book = bk;
  $("book").value = S.book;
  if (pr) S.proj = pr;
  if (DATA.emotions.includes(em)) S.emotion = em;
  $("emotion").value = S.emotion;
  if (i && !isNaN(+i)) S.i = +i;
  controlsFor();
  S.tube = tb === "tube" && $("tube").style.display !== "none";
  $("tube").setAttribute("aria-pressed", S.tube);
  draw();
}
follow(fromHash);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
</script>
</body>
</html>
